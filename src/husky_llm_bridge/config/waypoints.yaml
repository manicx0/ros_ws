# Named waypoints for LLM mission planning
# Waypoints can be defined in odom frame (x, y) or GPS coordinates (lat, lon)
# GPS coordinates are converted to odom using the gps_origin below

gps_origin:
  lat: 50.109461
  lon: -97.318978

waypoints:
  origin:
    name: "Charging Station"
    odom: {x: 0.0, y: 0.0}
  
  point_a:
    name: "Loading Dock"
    odom: {x: 8.0, y: 5.0}
  
  point_b:
    name: "Inspection Zone"
    odom: {x: -3.0, y: 12.0}
  
  point_c:
    name: "Refuel Point"
    odom: {x: 15.0, y: -7.0}
  
  point_d:
    name: "Storage"
    odom: {x: -10.0, y: -10.0}
  
  test_point:
    name: "Test GPS Waypoint"
    gps: {lat: 50.109661, lon: -97.318678}
