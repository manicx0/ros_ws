serial_number: a200-0000
version: 0

system:
  username: robot
  hosts:
    - hostname: cpr-a200-0000
      ip: 192.168.131.1
  ros2:
    namespace: a200_0000
    domain_id: 0
    middleware:
      implementation: rmw_fastrtps_cpp

platform:
  model: a200
  # We add the standard Clearpath sensor arch mount onto the Husky top plate
  attachments:
    - name: sensor_arch
      type: a200.sensor_arch
      model: sensor_arch_300
      parent: top_plate_link

sensors:
  # 1. 3D LiDAR configuration for your VLP-16 (Matches obstacle detector requirements)
  lidar3d:
    - model: velodyne_vlp16
      urdf_enabled: true
      launch_enabled: true
      parent: sensor_arch_mount
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        velodyne_driver_node:
          frame_id: lidar3d_0_laser
          device_ip: 192.168.131.25
          port: 2368
          model: VLP16
        velodyne_transform_node:
          model: VLP16
          fixed_frame: lidar3d_0_laser
          target_frame: lidar3d_0_laser

  # 2. Standard onboard IMU configuration (Matches your EKF fusion requirements)
  imu:
    - model: microstrain_imu
      urdf_enabled: true
      launch_enabled: true
      parent: base_link
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        microstrain_inertial_driver:
          frame_id: imu_0_link

  # 3. GPS receiver (Optional, matching your EKF setup)
  gps:
    - model: nmea_gps
      urdf_enabled: true
      launch_enabled: true
      parent: top_plate_link
      xyz: [0.0, 0.0, 0.1]
      rpy: [0.0, 0.0, 0.0]
